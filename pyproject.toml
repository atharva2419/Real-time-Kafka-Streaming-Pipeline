[project]
name = "wiki-stream-pipeline"
version = "2.0.0"
description = "Real-time Kafka streaming pipeline over the Wikimedia edit firehose"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["pipeline", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true

# kafka-python ships no py.typed marker and has no stubs on typeshed, so the
# checker cannot see into it. This silences the import noise without turning
# off type checking for our own code that uses it.
[[tool.mypy.overrides]]
module = ["kafka.*", "sseclient.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["pipeline"]
omit = ["pipeline/api/*"]

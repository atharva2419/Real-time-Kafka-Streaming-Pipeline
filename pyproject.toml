[project]
name = "wiki-stream-pipeline"
version = "2.0.0"
description = "Real-time Kafka streaming pipeline over the Wikimedia edit firehose"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.coverage.run]
source = ["pipeline"]
omit = ["pipeline/api/*"]

name: wiki-stream

services:
  # Kafka in KRaft mode - no ZooKeeper. ZooKeeper is deprecated since Kafka 3.5
  # and removed in 4.0; the broker is its own controller quorum here.
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      # Containers reach the broker as kafka:29092; the host reaches it as
      # localhost:9092. Both advertised names must be present or one side breaks.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - kafka-data:/var/lib/kafka/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  producer:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python -m pipeline.producer.produce
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: unless-stopped

  aggregator:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python -m pipeline.consumer.aggregator
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      # arrival | event -- see docs/DESIGN.md section 3
      WINDOW_TIME_SOURCE: ${WINDOW_TIME_SOURCE:-arrival}
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python -m pipeline.api.server
    # No host port: everything is reached through the gateway below.
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
    restart: unless-stopped

  # The single front door: the app at /, Grafana at /grafana/, Prometheus at
  # /prometheus/. It only routes, so the monitoring views keep answering when
  # the API they watch goes down.
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  # --- Observability -------------------------------------------------------
  # Behind a profile, so `docker compose up` stays a six-container stack.
  # Start it with: docker compose --profile obs up -d
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    profiles: [obs]
    command: ["--kafka.server=kafka:29092"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    profiles: [obs]
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [obs]
    # Served internally at its root, so Grafana's datasource and the self-scrape
    # keep plain URLs, while every link it generates carries /prometheus/ to
    # match the gateway, which strips that prefix on the way in.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.external-url=${PUBLIC_URL:-http://localhost:8000}/prometheus/
      - --web.route-prefix=/
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - producer
      - aggregator
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    profiles: [obs]
    environment:
      # Served from /grafana/ through the gateway. root_url must be the address
      # the browser sees, or redirects and Grafana Live's origin check break.
      GF_SERVER_ROOT_URL: ${PUBLIC_URL:-http://localhost:8000}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Anonymous viewing so the board opens without a login prompt; this is a
      # laptop demo, not a deployment.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  kafka-data:
  prometheus-data:
  grafana-data:

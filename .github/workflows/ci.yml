name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      # Redis is needed for the sink tests; without it they skip rather than
      # fail, which would quietly hide the idempotency regressions they cover.
      - name: Start Redis
        run: docker compose up -d redis

      - name: Test
        run: pytest --cov --cov-report=term-missing

      - name: Fail if sink tests were skipped
        run: |
          if pytest tests/test_sink.py -q | grep -q "skipped"; then
            echo "Sink tests skipped - Redis was not reachable"
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose --profile obs build

      - name: Start the stack
        run: docker compose --profile obs up -d

      - name: Wait for the API to report a live window
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/healthz | grep -q '"status":"ok"'; then
              echo "pipeline is live"
              curl -s http://localhost:8000/api/latest | head -c 400
              exit 0
            fi
            sleep 5
          done
          echo "pipeline did not become healthy in time"
          docker compose logs --tail=50
          exit 1

      - name: Wait for every Prometheus target to be up
        run: |
          for i in $(seq 1 30); do
            down=$(curl -sf 'http://localhost:9090/api/v1/targets?state=active'               | grep -o '"health":"[a-z]*"' | grep -cv '"health":"up"' || true)
            total=$(curl -sf 'http://localhost:9090/api/v1/targets?state=active'               | grep -co '"health":"[a-z]*"' || echo 0)
            if [ "$total" -ge 6 ] && [ "$down" -eq 0 ]; then
              echo "all $total scrape targets up"
              exit 0
            fi
            sleep 5
          done
          echo "scrape targets did not all come up"
          curl -s 'http://localhost:9090/api/v1/targets?state=active'
          docker compose --profile obs logs --tail=30 prometheus
          exit 1

      - name: Tear down
        if: always()
        run: docker compose --profile obs down -v

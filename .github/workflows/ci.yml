name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      # Redis backs the sink tests and ClickHouse the rollup and analytics
      # tests. Without them those tests skip rather than fail, which would
      # quietly hide exactly the regressions they exist to catch.
      - name: Start Redis and ClickHouse
        run: |
          docker compose up -d redis clickhouse
          for i in $(seq 1 45); do
            curl -sf http://localhost:8123/ping >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8123/ping

      - name: Test
        run: pytest --cov --cov-report=term-missing

      - name: Fail if any service-backed tests were skipped
        run: >-
          bash scripts/assert_no_skips.sh
          tests/test_sink.py tests/test_rollups.py tests/test_analytics.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose --profile obs build

      - name: Start the stack
        run: docker compose --profile obs up -d

      - name: Wait for the API to report a live window
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/healthz | grep -q '"status":"ok"'; then
              echo "pipeline is live"
              curl -s http://localhost:8000/api/latest | head -c 400
              exit 0
            fi
            sleep 5
          done
          echo "pipeline did not become healthy in time"
          docker compose logs --tail=50
          exit 1

      - name: Wait for every Prometheus target to be up
        run: bash scripts/wait_for_targets.sh 6 30

      - name: Check the gateway routes every UI
        run: bash scripts/check_gateway.sh

      - name: Check the cold path is ingesting
        run: bash scripts/check_cold_path.sh

      - name: Prometheus logs on failure
        if: failure()
        run: docker compose --profile obs logs --tail=40 prometheus

      - name: Tear down
        if: always()
        run: docker compose --profile obs down -v

# The single front door for the whole stack.
#
#   /              the live edit dashboard and its API
#   /grafana/      the pipeline health board
#   /prometheus/   alerts and ad-hoc queries
#
# Grafana and Prometheus stay separate processes on purpose. The point of a
# monitoring view is that it keeps working when the thing it watches breaks, so
# this gateway only routes - if the API dies, /grafana/ still answers and you
# can watch the outage happen.

# WebSocket upgrades: pass `Upgrade` through when the client asks for one, and
# a plain close otherwise.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # Docker's embedded DNS. Resolving upstreams per request rather than at
    # startup lets the gateway boot without the obs profile running; those
    # paths then answer with instructions instead of nginx refusing to start
    # over a hostname it cannot find.
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $api        api:8000;
    set $grafana    grafana:3000;
    set $prometheus prometheus:9090;

    # Every header is set here, at server level, and never inside a location.
    # nginx does not merge proxy_set_header: a location that sets even one
    # header silently drops all of these, which breaks Grafana's origin check.
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # --- Grafana --------------------------------------------------------------
    # Grafana is told to serve from /grafana/ itself (GF_SERVER_SERVE_FROM_SUB_PATH),
    # so the path goes through unchanged. Grafana Live's websocket rides on the
    # upgrade headers above.
    location = /grafana {
        return 301 /grafana/;
    }
    location /grafana/ {
        proxy_pass http://$grafana;
        error_page 502 504 = @obs_not_running;
    }

    # --- Prometheus -----------------------------------------------------------
    # Prometheus serves from its root internally, so Grafana's datasource and
    # its own self-scrape keep plain URLs, and generates links under
    # /prometheus/ via --web.external-url. The prefix is stripped on the way in.
    location = /prometheus {
        return 301 /prometheus/;
    }
    location /prometheus/ {
        rewrite ^/prometheus/(.*)$ /$1 break;
        proxy_pass http://$prometheus;
        error_page 502 504 = @obs_not_running;
    }

    location @obs_not_running {
        default_type text/plain;
        return 503 "Grafana and Prometheus are not running.\nStart them with:  docker compose --profile obs up -d\n";
    }

    # --- App ------------------------------------------------------------------
    # The API's /metrics is for Prometheus on the internal network, which
    # scrapes api:8000 directly. It has no business on the public front door.
    location = /metrics {
        return 404;
    }

    location /ws {
        # The API pushes only when a window changes, so a stalled pipeline means
        # minutes without an application message on this socket. What actually
        # keeps it open is uvicorn's own 20s ping, which counts as traffic for
        # nginx's 60s read timeout - measured: 90s of app silence through this
        # gateway at the default timeout, socket still open. The longer timeout
        # is insurance for a server that does not ping, not the thing that works.
        proxy_read_timeout 1h;
        proxy_pass http://$api;
    }

    location / {
        proxy_pass http://$api;
    }
}
